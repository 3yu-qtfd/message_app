---
# tasks file for init
- name: Set timezone to Asia/Tokyo
  community.general.timezone:
    name: Asia/Tokyo

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install git
  ansible.builtin.dnf:
    name:
      - git
    state: present

- name: Clone repository
  ansible.builtin.git:
    repo: https://github.com/3yu-qtfd/message_app.git
    dest: "{{ app_directory }}"
    version: main
    accept_hostkey: yes

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv .venv
    chdir: "{{ app_directory }}"
    creates: "{{ app_directory }}/.venv"
