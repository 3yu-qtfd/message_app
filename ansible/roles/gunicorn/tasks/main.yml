---
# tasks file for gunicorn
- name: Install required Python package
  ansible.builtin.pip:
    name:
      - gunicorn
    state: present
    virtualenv: "{{ venv_dir }}"

- name: Place gunicorn systemd service
  ansible.builtin.template:
    src: roles/gunicorn/templates/gunicorn_service.j2
    dest: /etc/systemd/system/gunicorn.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start gunicorn
  ansible.builtin.systemd:
    name: gunicorn
    enabled: yes
    state: started
