- name: Apply Roles to target node
  hosts: target
  become: yes
  roles:
    - init
    - python
    - gunicorn
    - nginx
    - mariadb
  vars:
    user: ec2-user
    app_dir: /home/ec2-user/diary_app
    venv_dir: /home/ec2-user/diary_app/app/venv
  vars_files:
    - /home/ec2-user/message_app/ansible/secrets.yml
